<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leaflet Map</title>
  <style>
    /* Inlined Leaflet styles for offline capability */
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #1e1e1e;
    }
  </style>
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // Initialize map
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 1,
      maxZoom: 18,
      attributionControl: false
    });

    // Dark-themed tile layer (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20
    }).addTo(map);

    const markers = {};

    // Map communication to host
    function selectServer(serverId) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'select_server',
          id: serverId
        }));
      }
    }

    // Function exposed to WPF to plot servers
    window.addServerMarker = function(id, name, lat, lng, ip, status) {
      if (markers[id]) {
        map.removeLayer(markers[id]);
      }

      const color = status === 'connected' ? '#4CAF50' : (status === 'loading' ? '#FFC107' : '#2196F3');
      const icon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="background-color: ${color}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,0,0,0.5);"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      const marker = L.marker([lat, lng], { icon: icon }).addTo(map);
      marker.bindPopup(`<b style="color: #333;">${name}</b><br/><span style="color: #666;">IP: ${ip}</span><br/><span style="color: #666;">Status: ${status}</span>`);

      marker.on('click', () => {
        selectServer(id);
      });

      markers[id] = marker;
    };

    // Function exposed to WPF to focus / center onto a coordinate
    window.centerMap = function(lat, lng, zoomLevel) {
      map.setView([lat, lng], zoomLevel || 6, {
        animate: true,
        duration: 1.5
      });
    };
  </script>
</body>
</html>
