name: Android App Release

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - 'Android/**'
      - '.github/workflows/desktop-build.yml'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/create-release.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc_version
        run: |
          MAJOR_MINOR="1.3"
          PREFIX="v${MAJOR_MINOR}."

          TAG_AT_HEAD=$(git tag --points-at HEAD "${PREFIX}*" | head -n 1)

          if [ -n "$TAG_AT_HEAD" ]; then
              TAG_NAME="$TAG_AT_HEAD"
              APP_VERSION="${TAG_NAME#v}"
              PATCH="${APP_VERSION#${MAJOR_MINOR}.}"
          else
              HIGHEST_PATCH=-1
              for tag in $(git tag -l "${PREFIX}*"); do
                  NUM="${tag#$PREFIX}"
                  if [[ "$NUM" =~ ^[0-9]+$ ]]; then
                      if [ "$NUM" -gt "$HIGHEST_PATCH" ]; then
                          HIGHEST_PATCH="$NUM"
                      fi
                  fi
              done

              if [ "$HIGHEST_PATCH" -ge 0 ]; then
                  PATCH=$((HIGHEST_PATCH + 1))
              else
                  PATCH=0
              fi
              APP_VERSION="${MAJOR_MINOR}.${PATCH}"
              TAG_NAME="v${APP_VERSION}"
          fi

          if [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              VERSION_CODE=$((1000 + PATCH))
          else
              VERSION_CODE=1
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android App
        run: |
          chmod +x Android/gradlew
          cd Android
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}" -PversionCode="${{ env.VERSION_CODE }}"

      - name: Prepare Release Asset
        run: |
          mkdir -p Android/Output
          if [ -f "Android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp Android/app/build/outputs/apk/release/app-release.apk Android/Output/OxygenLowsSoftware.apk
          elif [ -f "Android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp Android/app/build/outputs/apk/release/app-release-unsigned.apk Android/Output/OxygenLowsSoftware.apk
          else
            APK_FILE=$(find Android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" Android/Output/OxygenLowsSoftware.apk
          fi

      - name: Upload Android App to Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: Android/Output/OxygenLowsSoftware.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
