name: Desktop App Release

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc_version
        run: |
          $majorMinor = "1.2"
          $prefix = "v$majorMinor."
          $tags = git tag -l "$prefix*"
          if ($tags) {
              $highestPatch = $tags | ForEach-Object {
                  $num = $_ -replace "^$prefix", ""
                  if ($num -match "^\d+$") { [int]$num } else { -1 }
              } | Measure-Object -Maximum | Select-Object -ExpandProperty Maximum
              if ($highestPatch -ge 0) {
                  $patch = $highestPatch + 1
              } else {
                  $patch = 0
              }
          } else {
              $patch = 0
          }
          $appVersion = "$majorMinor.$patch"
          $tagName = "v$appVersion"
          echo "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          echo "TAG_NAME=$tagName" >> $env:GITHUB_ENV

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Publish Desktop App
        run: |
          cd Desktop/DesktopApp
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version="${{ env.APP_VERSION }}" -o ../DesktopAppOut

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Desktop\installer.iss" /DAppVersion="${{ env.APP_VERSION }}" /DAppSource="DesktopAppOut\*"

      # Tag is created dynamically in Calculate Version step

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: Desktop/Output/OxygenLowsSoftware_Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
