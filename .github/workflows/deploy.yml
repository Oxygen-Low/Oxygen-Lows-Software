name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.14.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Rewrite workspace deps for npm compatibility
        run: |
          # Replace workspace:* references with file: paths so npm can resolve them
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
              if (!pkg[section]) continue;
              for (const [name, version] of Object.entries(pkg[section])) {
                if (version.startsWith('workspace:')) {
                  // Find the matching package folder
                  const fs2 = require('fs');
                  const path = require('path');
                  const pkgsDir = 'packages';
                  const dirs = fs2.readdirSync(pkgsDir);
                  for (const dir of dirs) {
                    const subPkg = JSON.parse(fs2.readFileSync(path.join(pkgsDir, dir, 'package.json'), 'utf8'));
                    if (subPkg.name === name) {
                      pkg[section][name] = 'file:packages/' + dir;
                      break;
                    }
                  }
                }
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Rewrote workspace: deps to file: paths');
          "

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout or create the plesk branch
          git checkout -B plesk

          # Remove files not needed for hosting
          rm -rf Android Desktop

          # Force add the built dist directory (since it's in .gitignore)
          git add -f dist/

          # Add any other potential changes
          git add .

          # Commit the changes. If there's nothing to commit, it won't fail the workflow
          git commit -m "chore: build and deploy to plesk branch" || echo "No changes to commit"

          # Push to the plesk branch, overwriting its history if needed
          git push -f origin plesk
