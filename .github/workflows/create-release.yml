name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - "Desktop/**"
      - "Android/**"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/create-release.yml"
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc_version
        run: |
          MAJOR_MINOR="1.3"
          PREFIX="v${MAJOR_MINOR}."

          TAG_AT_HEAD=$(git tag --points-at HEAD "${PREFIX}*" | head -n 1)

          if [ -n "$TAG_AT_HEAD" ]; then
              TAG_NAME="$TAG_AT_HEAD"
              APP_VERSION="${TAG_NAME#v}"
          else
              HIGHEST_PATCH=-1
              for tag in $(git tag -l "${PREFIX}*"); do
                  NUM="${tag#$PREFIX}"
                  if [[ "$NUM" =~ ^[0-9]+$ ]]; then
                      if [ "$NUM" -gt "$HIGHEST_PATCH" ]; then
                          HIGHEST_PATCH="$NUM"
                      fi
                  fi
              done

              if [ "$HIGHEST_PATCH" -ge 0 ]; then
                  PATCH=$((HIGHEST_PATCH + 1))
              else
                  PATCH=0
              fi
              APP_VERSION="${MAJOR_MINOR}.${PATCH}"
              TAG_NAME="v${APP_VERSION}"
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
