name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Desktop/**"
      - "Android/**"
      - "OS/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.calc_version.outputs.app_version }}
      tag_name: ${{ steps.calc_version.outputs.tag_name }}
      version_code: ${{ steps.calc_version.outputs.version_code }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc_version
        run: |
          MAJOR_MINOR="1.4"
          PREFIX="v${MAJOR_MINOR}."

          TAG_AT_HEAD=$(git tag --points-at HEAD "${PREFIX}*" | head -n 1)

          if [ -n "$TAG_AT_HEAD" ]; then
              TAG_NAME="$TAG_AT_HEAD"
              APP_VERSION="${TAG_NAME#v}"
              PATCH="${APP_VERSION#${MAJOR_MINOR}.}"
          else
              HIGHEST_PATCH=-1
              for tag in $(git tag -l "${PREFIX}*"); do
                  NUM="${tag#$PREFIX}"
                  if [[ "$NUM" =~ ^[0-9]+$ ]]; then
                      if [ "$NUM" -gt "$HIGHEST_PATCH" ]; then
                          HIGHEST_PATCH="$NUM"
                      fi
                  fi
              done

              if [ "$HIGHEST_PATCH" -ge 0 ]; then
                  PATCH=$((HIGHEST_PATCH + 1))
              else
                  PATCH=0
              fi
              APP_VERSION="${MAJOR_MINOR}.${PATCH}"
              TAG_NAME="v${APP_VERSION}"
          fi

          if [[ "$PATCH" =~ ^[0-9]+$ ]]; then
              VERSION_CODE=$((1000 + PATCH))
          else
              VERSION_CODE=1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build Desktop App
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Publish Desktop App
        run: |
          cd Desktop/DesktopApp
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version="${{ needs.version.outputs.app_version }}" -o ../DesktopAppOut

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Desktop\installer.iss" /DAppVersion="${{ needs.version.outputs.app_version }}" /DAppSource="DesktopAppOut\*"

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: Desktop/Output/OxygenLowsSoftware_Installer.exe
          if-no-files-found: error

  build-android:
    name: Build Android App
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > Android/app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android App
        run: |
          chmod +x Android/gradlew
          cd Android
          ./gradlew assembleRelease -PversionName="${{ needs.version.outputs.app_version }}" -PversionCode="${{ needs.version.outputs.version_code }}"
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Asset
        run: |
          mkdir -p Android/Output
          if [ -f "Android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp Android/app/build/outputs/apk/release/app-release.apk Android/Output/OxygenLowsSoftware.apk
          elif [ -f "Android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp Android/app/build/outputs/apk/release/app-release-unsigned.apk Android/Output/OxygenLowsSoftware.apk
          else
            APK_FILE=$(find Android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" Android/Output/OxygenLowsSoftware.apk
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: Android/Output/OxygenLowsSoftware.apk
          if-no-files-found: error

  build-os:
    name: Build OS ISO
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc g++ xorriso grub-pc-bin grub-common mtools qemu-system-x86 python3

      - name: Build Oxygen Low's Software Kernel & ISO
        run: |
          cd OS
          make iso

      - name: Run Automated Headless Verification
        run: |
          cd OS
          python3 test_runner.py --iso OxygenLowsSoftware.iso --timeout 25.0

      - name: Prepare OS Release Asset
        run: |
          mkdir -p OS/Output
          cp OS/OxygenLowsSoftware.iso OS/Output/OxygenLowsSoftware.iso

      - name: Upload OS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-iso
          path: OS/Output/OxygenLowsSoftware.iso
          if-no-files-found: error

  publish-release:
    name: Create & Publish Release
    needs: [version, build-desktop, build-android, build-os]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-installer
          path: release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: release_assets

      - name: Download OS Artifact
        uses: actions/download-artifact@v7
        with:
          name: os-iso
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Release ${{ needs.version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            release_assets/OxygenLowsSoftware_Installer.exe
            release_assets/OxygenLowsSoftware.apk
            release_assets/OxygenLowsSoftware.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
