name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Desktop/**"
      - "Android/**"
      - "OS/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Calculate Version & Create Release
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.calc_version.outputs.app_version }}
      tag_name: ${{ steps.calc_version.outputs.tag_name }}
      version_code: ${{ steps.calc_version.outputs.version_code }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc_version
        run: |
          MAJOR_MINOR="1.5"
          MAJOR="${MAJOR_MINOR%%.*}"
          MINOR="${MAJOR_MINOR#*.}"
          PREFIX="v${MAJOR_MINOR}."

          TAG_AT_HEAD=$(git tag --points-at HEAD "${PREFIX}*" | head -n 1)

          if [ -n "$TAG_AT_HEAD" ]; then
              TAG_NAME="$TAG_AT_HEAD"
              APP_VERSION="${TAG_NAME#v}"
              PATCH="${APP_VERSION#${MAJOR_MINOR}.}"
          else
              HIGHEST_PATCH=-1
              for tag in $(git tag -l "${PREFIX}*"); do
                  NUM="${tag#$PREFIX}"
                  if [[ "$NUM" =~ ^[0-9]+$ ]]; then
                      if [ "$NUM" -gt "$HIGHEST_PATCH" ]; then
                          HIGHEST_PATCH="$NUM"
                      fi
                  fi
              done

              if [ "$HIGHEST_PATCH" -ge 0 ]; then
                  PATCH=$((HIGHEST_PATCH + 1))
              else
                  PATCH=0
              fi
              APP_VERSION="${MAJOR_MINOR}.${PATCH}"
              TAG_NAME="v${APP_VERSION}"
          fi

          if [[ "$PATCH" =~ ^[0-9]+$ && "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ ]]; then
              # versionCode must increase across every release line. Restarting at
              # 1000 for each major.minor makes Android reject the APK as a
              # downgrade ("App not installed as package appears to be invalid").
              VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH))
          else
              VERSION_CODE=1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.calc_version.outputs.tag_name }}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi

  build-desktop:
    name: Build Desktop App
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Publish Desktop App
        run: |
          cd Desktop/DesktopApp
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version="${{ needs.version.outputs.app_version }}" -o ../DesktopAppOut

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Desktop\installer.iss" /DAppVersion="${{ needs.version.outputs.app_version }}" /DAppSource="DesktopAppOut\*"

      - name: Upload Desktop Installer to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" Desktop/Output/OxygenLowsSoftware_Installer.exe --clobber

  build-llama-android:
    name: Build llama.cpp binaries (Android)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve llama.cpp source (Hy4 Flash support PR)
        id: llama_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hy4 Flash GGUF support lives in ggml-org/llama.cpp PR #32517, which
          # has not been merged yet. Pin the build to the PR head so the shipped
          # binaries can run Hy4 Flash models. Once merged, this can switch back
          # to the latest release tag.
          PR_JSON=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ggml-org/llama.cpp/pulls/32517)
          HEAD_SHA=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
          BASE_TAG=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ggml-org/llama.cpp/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building llama.cpp from PR #32517 @ $HEAD_SHA (base $BASE_TAG)"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Clone and build llama.cpp for Android
        env:
          LLAMA_SHA: ${{ steps.llama_version.outputs.sha }}
          LLAMA_TAG: ${{ steps.llama_version.outputs.tag }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama-src
          cd llama-src
          git fetch origin pull/32517/head:hy4-flash
          git checkout --detach "$LLAMA_SHA"
          NDK="$ANDROID_NDK_HOME"
          HOST_TAG=linux-x86_64
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/$HOST_TAG/bin"
          API=24
          for ABI in arm64-v8a armeabi-v7a; do
            case "$ABI" in
              arm64-v8a) TRIPLE=aarch64-linux-android; OUT=arm64 ;;
              armeabi-v7a) TRIPLE=armv7a-linux-androideabi; OUT=arm ;;
            esac
            export CC="$TOOLCHAIN/$TRIPLE$API-clang"
            export CXX="$TOOLCHAIN/$TRIPLE$API-clang++"
            cmake -S . -B "build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-$API \
              -DGGML_OPENMP=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$ABI" --target llama-server -j2
            mkdir -p "../llama-out-$OUT"
            cp "build-$ABI/bin/llama-server" "../llama-out-$OUT/llama-server"
          done
          cd ..
          for OUT in arm64 arm; do
            (cd "llama-out-$OUT" && zip -q "../llama-android-$OUT.zip" llama-server)
          done
          # Record the exact llama.cpp source inside the manifest so the app can
          # advertise which build (PR #32517 for Hy4 Flash support) it ships.
          printf '{"llamaVersion":"%s","source":"pr-32517","sha":"%s","feature":"hy4-flash"}\n' \
            "$LLAMA_TAG" "$LLAMA_SHA" > llama-manifest.json

      - name: Upload llama.cpp Android binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" \
            llama-android-arm64.zip llama-android-arm.zip llama-manifest.json --clobber

  build-llama-windows:
    name: Build llama.cpp binaries (Windows, Hy4 Flash)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve llama.cpp source (Hy4 Flash support PR)
        id: llama_version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ggml-org/llama.cpp/pulls/32517)
          HEAD_SHA=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
          BASE_TAG=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ggml-org/llama.cpp/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Clone and build llama.cpp for Windows
        shell: bash
        env:
          LLAMA_SHA: ${{ steps.llama_version.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama-src
          cd llama-src
          git fetch origin pull/32517/head:hy4-flash
          git checkout --detach "$LLAMA_SHA"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON
          cmake --build build --config Release --target llama-server -j2
          mkdir -p ../llama-out
          cp build/bin/Release/llama-server.exe ../llama-out/llama-server.exe
          # Copy required DLLs (if any) alongside the server.
          find build/bin/Release -maxdepth 1 -name "*.dll" -exec cp {} ../llama-out/ \; || true
          cd ..
          powershell -Command "Compress-Archive -Path 'llama-out\\*' -DestinationPath 'llama-win-x64.zip' -Force"

      - name: Upload llama.cpp Windows binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" llama-win-x64.zip --clobber

  build-android:
    name: Build Android App
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > Android/app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android App
        run: |
          chmod +x Android/gradlew
          cd Android
          ./gradlew assembleRelease -PversionName="${{ needs.version.outputs.app_version }}" -PversionCode="${{ needs.version.outputs.version_code }}"
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Asset
        run: |
          mkdir -p Android/Output
          if [ -f "Android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp Android/app/build/outputs/apk/release/app-release.apk Android/Output/OxygenLowsSoftware.apk
          elif [ -f "Android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp Android/app/build/outputs/apk/release/app-release-unsigned.apk Android/Output/OxygenLowsSoftware.apk
          else
            APK_FILE=$(find Android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" Android/Output/OxygenLowsSoftware.apk
          fi

      - name: Upload Android APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" Android/Output/OxygenLowsSoftware.apk --clobber

  build-os:
    name: Build OS ISO
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc g++ xorriso grub-pc-bin grub-common mtools qemu-system-x86 python3

      - name: Build Oxygen Low's Software Kernel & ISO
        run: |
          cd OS
          make iso

      - name: Run Automated Headless Verification
        run: |
          cd OS
          python3 test_runner.py --iso OxygenLowsSoftware.iso --timeout 45.0 --verbose

      - name: Prepare OS Release Asset
        run: |
          mkdir -p OS/Output
          cp OS/OxygenLowsSoftware.iso OS/Output/OxygenLowsSoftware.iso

      - name: Upload OS ISO to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" OS/Output/OxygenLowsSoftware.iso --clobber
