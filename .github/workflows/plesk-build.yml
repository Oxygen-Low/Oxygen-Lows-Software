name: Build and Push for Plesk

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # Matches the version in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Push to build branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and switch to the build branch
          git checkout -B build
          
          # Force add the dist/ directory since it is in .gitignore
          git add -f dist/
          
          # Add all other current files
          git add -A
          
          # Commit the build artifacts
          git commit -m "Automated build for Plesk [skip ci]" || echo "No changes to commit"
          
          # Force push to the build branch
          git push -f origin build
