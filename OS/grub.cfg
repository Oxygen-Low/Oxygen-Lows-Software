set timeout=5
set default=0

insmod all_video
insmod part_msdos
insmod iso9660

set gfxmode=1024x768x32,1024x768x24,800x600x32,800x600x24,640x480x32,auto
set gfxpayload=keep

menuentry "Install Oxygen Low's Software" {
    multiboot2 /boot/kernel.elf mode=install
    boot
}

menuentry "Update Existing Installation" {
    multiboot2 /boot/kernel.elf mode=update
    boot
}

menuentry "Repair Installation" {
    multiboot2 /boot/kernel.elf mode=repair
    boot
}

menuentry "Try Oxygen Low's Software (Live Desktop)" {
    multiboot2 /boot/kernel.elf mode=live
    boot
}
