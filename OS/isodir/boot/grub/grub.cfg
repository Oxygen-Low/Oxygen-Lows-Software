set timeout=0
set default=0

insmod all_video
insmod vbe
insmod vga
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod part_msdos
insmod iso9660

set gfxmode=1024x768x32,1024x768,auto
set gfxpayload=keep

menuentry "Oxygen Low's Software" {
    multiboot2 /boot/kernel.elf
    boot
}
